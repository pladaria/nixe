[package]
name = "nixe-gpu-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Share physical-GPU helpers with frontend tests through a crate dependency.
test-support = []
performance-counters = ["nixe-gpu/performance-counters"]

[dependencies]
log.workspace = true
nixe-gpu.workspace = true
nixe-memory.workspace = true
pollster.workspace = true
rustc-hash.workspace = true
wgpu.workspace = true

[dev-dependencies]
nixe-cpu.workspace = true
nixe-cpu-direct-memory.workspace = true
nixe-cpu-jit.workspace = true
tempfile.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Keep the Vulkan ABI identical to wgpu-hal's device and resource handles.
ash = "=0.38.0"
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
wgpu-types = "=30.0.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libloading = "=0.8.9"
