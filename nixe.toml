version = 2

[library]
# Directories scanned for supported title and homebrew files. Relative paths
# are resolved from the directory containing this configuration file.
paths = ["./roms/"]
# When true, title discovery also scans subdirectories below every library path.
# When false, only files directly inside each configured directory are scanned.
recursive_scan = true
# Follow symbolic links to files and directories, skipping already visited directories.
# Linked subdirectories are scanned only when recursive_scan is true.
follow_symlinks = true
# Before launch, convert solid NCZ entries in the selected title's NSZ packages
# to independent 1 MiB blocks. The first conversion can take some time.
convert_solid_to_blocks = true
# After a verified conversion: "rename" keeps <filename>.nsz.solid; "remove" discards
# the original; "trash" (default) moves it to the system trash. If trash fails, retain
# the .solid backup and log a warning.
keep_solid_backup = "trash"

[filesystem]
# Host directory exposed to the guest as the removable sdmc: filesystem.
# Relative paths are resolved from the directory containing this file.
sd_card = "./storage/sdmc"
# Persistent save volumes, isolated by application and user.
save_data = "./storage/save"
# Host screenshot directory; relative to this configuration file.
screenshots = "./storage/screenshots"

[system]
dictionary = "assets/dict.toml"
# Languages tried for title metadata, in descending preference order. If a
# title lacks the first language, the next available configured language is
# used before the loader's deterministic fallback.
preferred_languages = ["Spanish", "AmericanEnglish"]
# Directory containing caller-owned prod.keys and, optionally, title.keys.
# Relative paths are resolved from the directory containing this file.
keys = "./keys/"
# TTF supplied to applications requesting a system font; relative to this file.
font = "./assets/DejaVuSans.ttf"
# font = "./assets/NotoSans-Regular.ttf"
# Start in docked mode when true, or handheld mode when false.
is_docked = true

[system.time]
# "realtime" anchors to the host clock at launch and advances monotonically.
# "fixed" freezes wall and monotonic time at fixed_unix_timestamp.
mode = "realtime"
# IANA time-zone location exposed by Horizon's time-zone service.
timezone = "Europe/Madrid"
# Required only with mode = "fixed".
# fixed_unix_timestamp = 0

[diagnostics]
# Minimum severity emitted by the CLI logger.
log_level = "debug"
# Preserve each Horizon guest log packet's severity. A concrete level forces
# all guest messages to that host level; "off" discards them.
guest_logs_level = "inherit"
# Ask the guest filesystem SDK to emit access logs through Horizon's logger.
file_system_access_log = true

# Emulated output layout. Only stereo (2.0) is currently implemented.
[audio]
output = "stereo"
# Host volume: 0 mutes output, 100 is full volume. Defaults to 100.
volume = 10

[video]
# Filter for fitting the game image to the window; does not change render resolution.
# "nearest": sharp pixels; useful for pixel art, but can alias when reducing.
# "bilinear": inexpensive smoothing for enlargement/reduction (default).
# "bicubic": Catmull-Rom interpolation; sharper than bilinear, may ring at edges.
# "lanczos": wider reconstruction filter; detailed, but may ring at edges.
# "gaussian": soft Gaussian filter; reduces sharpness in either direction.
# "area": pixel-area averaging; especially suitable for reducing high resolutions.
# "scaleforce": edge-aware enlargement; less suitable for reduction.
# "fsr": AMD FSR 1 spatial enlargement (EASU + RCAS); not frame generation.
# FSR is intended for enlargement.
scaling_filter = "bilinear"
# Antialiasing before presentation scaling. "none" (default) disables it;
# "fxaa" is a fast single-pass filter; "smaa" uses three passes for sharper edges.
anti_aliasing = "smaa"
# Synchronize host presentation to the monitor. Defaults to true when omitted.
# Disabling this allows tearing; guest-requested frame intervals are preserved.
vsync = true
# NVIDIA Smooth Motion on Linux/Vulkan. Defaults to false when omitted.
# Minimum NVIDIA requirements:
# - GeForce RTX 40 series: driver 580.82.07 or newer.
# - GeForce RTX 50 series: driver 575.51.02 beta (575.57.08 stable) or newer.
nvidia_smooth_motion = true

[gpu]
# Internal render resolution: 1.0 (native), 1.5, 2.0 or 3.0.
# 1.5: 720p => 1080p, 1080p => 1440p
# 2.0: 720p => 1440p, 1080p => 2160p
# 3.0: 720p => 2160p, 1080p => 3240p
resolution_scale = 2.0
# Compile MME macros to native AMD64 code; selected once per channel. Defaults to true.
mme_jit = true
# Per-title shader environments and Vulkan driver caches, relative to this file.
cache_directory = "./storage/cache/gpu"

# Use `cargo cli input` to get your controller's SDL gamepad information
[input.profiles.switch-pro]
device = "Nintendo Switch Pro Controller"
type = "switch-pro"
# button mapping for the SDL gamepad
a = "east"
b = "south"
x = "north"
y = "west"
plus = "start"
minus = "back"
home = "guide"
capture = "misc1"
l = "leftshoulder"
r = "rightshoulder"
leftstick = "leftstick"
rightstick = "rightstick"
dpup = "dpup"
dpdown = "dpdown"
dpleft = "dpleft"
dpright = "dpright"
zl = "lefttrigger"
zr = "righttrigger"
leftx = "leftx"
lefty = "lefty"
rightx = "rightx"
righty = "righty"
gyroscope = "gyroscope"
accelerometer = "accelerometer"
