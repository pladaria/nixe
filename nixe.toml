version = 2

[library]
# Directories scanned for supported title and homebrew files. Relative paths
# are resolved from the directory containing this configuration file.
paths = ["./roms/"]
# When true, title discovery also scans subdirectories below every library path.
# When false, only files directly inside each configured directory are scanned.
recursive_scan = true

[filesystem]
# Host directory exposed to the guest as the removable sdmc: filesystem.
# Relative paths are resolved from the directory containing this file.
sd_card = "./storage/sdmc"

[system]
# Languages tried for title metadata, in descending preference order. If a
# title lacks the first language, the next available configured language is
# used before the loader's deterministic fallback.
preferred_languages = ["Spanish", "AmericanEnglish"]
# Directory containing caller-owned prod.keys and, optionally, title.keys.
# Relative paths are resolved from the directory containing this file.
keys = "./keys/"
# Initial mode reported to applications: "handheld" or "docked".
initial_operation_mode = "handheld"

[system.time]
# "realtime" anchors to the host clock at launch and advances monotonically.
# "fixed" freezes wall and monotonic time at fixed_unix_timestamp.
mode = "realtime"
# IANA time-zone location exposed by Horizon's time-zone service.
timezone = "Europe/Madrid"
# Required only with mode = "fixed".
# fixed_unix_timestamp = 0

[diagnostics]
# Minimum severity emitted by the CLI logger.
log_level = "debug"

[cpu]
# CPU engine selected through the capability registry: "auto", "jit", or
# "interpreter". Auto prefers the production JIT and falls back to the
# interpreter only when the host or guest profile cannot satisfy JIT capabilities.
engine = "auto"
# Opt-in host-parallel vCPU execution. The runtime rejects this mode unless the
# selected engine provides concurrent executors, bounded safepoints, and
# acknowledged semantic memory invalidation. False keeps deterministic serialization.
parallel_vcpus = false

[cpu.jit]
# Per-process-domain native-code working set. Values may lower, but never exceed,
# the architectural hard bounds enforced by the JIT provider.
max_cached_regions = 32768
cache_mib = 512
# Native compilation uses an automatic per-domain worker pool sized to half of
# the host logical cores, with at least one worker. This retained bound applies
# only to the cache's short publication critical section.
max_concurrent_compilations = 4
# Optional compilation diagnostics. Missing or empty disables all JIT dumps;
# relative paths are resolved from the directory containing this file.
# dump_directory = "./dump/jit"
# Aggregate low-overhead JIT counters written during coordinated shutdown.
performance_report = "./dump/jit-performance.toml"

[gpu]
# Maximum working set retained by each shader cache. Entries are evicted by
# least-recent use; this is a software budget rather than a hardware limit.
# Values below six are rejected because one complete pipeline must fit.
shader_cache_entries = 4096
# Maximum number of neutral Maxwell pipelines retained in memory.
pipeline_cache_entries = 8192
# Maximum host-specialized WGPU variants retained for one neutral pipeline.
pipeline_variants_per_resource = 64
# Maximum host bind groups retained for one neutral descriptor table.
bind_groups_per_descriptor_table = 64
# Maximum accepted and persisted WGPU driver pipeline-cache size.
persistent_pipeline_cache_mib = 256

# Use `cargo cli input` to get your controller's SDL gamepad information
[input.profiles.switch-pro]
device = "Nintendo Switch Pro Controller"
type = "switch-pro"
# button mapping for the SDL gamepad
a = "east"
b = "south"
x = "north"
y = "west"
plus = "start"
minus = "back"
home = "guide"
capture = "misc1"
l = "leftshoulder"
r = "rightshoulder"
leftstick = "leftstick"
rightstick = "rightstick"
dpup = "dpup"
dpdown = "dpdown"
dpleft = "dpleft"
dpright = "dpright"
zl = "lefttrigger"
zr = "righttrigger"
leftx = "leftx"
lefty = "lefty"
rightx = "rightx"
righty = "righty"
gyroscope = "gyroscope"
accelerometer = "accelerometer"
