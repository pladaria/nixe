[workspace]
members = [
    "apps/cli",
    "crates/config",
    "crates/cpu",
    "crates/cpu-engine",
    "crates/cpu-engine-interpreter",
    "crates/cpu-engine-testkit",
    "crates/gpu",
    "crates/gpu-headless",
    "crates/gpu-maxwell",
    "crates/gpu-wgpu",
    "crates/horizon",
    "crates/input",
    "crates/loader/content",
    "crates/loader/executable",
    "crates/loader/storage",
    "crates/loader/title",
    "crates/memory",
    "crates/runtime",
    "crates/scheduler",
    "crates/video",
    "crates/video-winit",
    "tools/xtask",
]
exclude = ["crates/vendor/ruzstd-zbic", "fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
aes = "0.8.4"
bytemuck = "1.22"
chrono = "0.4.41"
chrono-tz = "0.10.4"
ctrlc = "3.4"
getrandom = "0.4"
lz4_flex = "0.11"
log = "0.4"
pollster = "0.4"
ruzstd-zbic = { path = "crates/vendor/ruzstd-zbic" }
sanitize-filename = "0.6"
sdl3 = { version = "=0.18.4", features = [
    "build-from-source",
    "build-from-source-unix-console",
    "hidapi",
] }
sdl3-sys = { version = "=0.6.7", features = ["no-sdl-video"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3.27"
nixe-config = { path = "crates/config" }
nixe-cpu = { path = "crates/cpu" }
nixe-cpu-engine = { path = "crates/cpu-engine" }
nixe-cpu-engine-interpreter = { path = "crates/cpu-engine-interpreter" }
nixe-cpu-engine-testkit = { path = "crates/cpu-engine-testkit" }
nixe-gpu = { path = "crates/gpu" }
nixe-gpu-headless = { path = "crates/gpu-headless" }
nixe-gpu-maxwell = { path = "crates/gpu-maxwell" }
nixe-gpu-wgpu = { path = "crates/gpu-wgpu" }
nixe-horizon = { path = "crates/horizon" }
nixe-input = { path = "crates/input" }
nixe-loader-content = { path = "crates/loader/content" }
nixe-loader-executable = { path = "crates/loader/executable" }
nixe-loader-storage = { path = "crates/loader/storage" }
nixe-loader-title = { path = "crates/loader/title" }
nixe-memory = { path = "crates/memory" }
nixe-runtime = { path = "crates/runtime" }
nixe-scheduler = { path = "crates/scheduler" }
nixe-video = { path = "crates/video" }
nixe-video-winit = { path = "crates/video-winit" }
wgpu = { version = "30", default-features = false, features = [
    "std",
    "vulkan",
    "wgsl",
] }
winit = "0.30"
toml = "0.8"
zstd = { version = "0.13", default-features = false }

[profile.profiling]
inherits = "release"
# Line tables retain source attribution for profilers without embedding the
# much larger full DWARF type and variable information used by debuggers.
debug = 1
